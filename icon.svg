<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#111019"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>
    <clipPath id="rounded">
      <rect width="128" height="128" rx="26"/>
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!--
    Three CSS variable declarations, centered vertically.
    Each has: two purple -- dashes + name bar (property line)
              then a shorter muted bar (value line)

    Variables fade in opacity top → bottom to suggest depth.
    Layout:
      var 1 property  y=25   value y=35
      var 2 property  y=57   value y=67
      var 3 property  y=89   value y=99
    Content span: 25–103 = 78 px  →  (128−78)/2 ≈ 25 top/bottom padding
  -->

  <!-- Variable 1 -->
  <rect x="20" y="25" width="9" height="5" rx="2.5" fill="#5e6ad2"/>
  <rect x="31" y="25" width="9" height="5" rx="2.5" fill="#5e6ad2"/>
  <rect x="44" y="25" width="54" height="5" rx="2.5" fill="#d0d0ee" opacity="0.72"/>
  <rect x="20" y="36" width="36" height="4" rx="2"   fill="#d0d0ee" opacity="0.32"/>

  <!-- Variable 2 -->
  <rect x="20" y="57" width="9" height="5" rx="2.5" fill="#5e6ad2" opacity="0.82"/>
  <rect x="31" y="57" width="9" height="5" rx="2.5" fill="#5e6ad2" opacity="0.82"/>
  <rect x="44" y="57" width="44" height="5" rx="2.5" fill="#d0d0ee" opacity="0.54"/>
  <rect x="20" y="68" width="28" height="4" rx="2"   fill="#d0d0ee" opacity="0.24"/>

  <!-- Variable 3 -->
  <rect x="20" y="89" width="9" height="5" rx="2.5" fill="#5e6ad2" opacity="0.58"/>
  <rect x="31" y="89" width="9" height="5" rx="2.5" fill="#5e6ad2" opacity="0.58"/>
  <rect x="44" y="89" width="34" height="5" rx="2.5" fill="#d0d0ee" opacity="0.38"/>
  <rect x="20" y="100" width="20" height="4" rx="2"  fill="#d0d0ee" opacity="0.16"/>
</svg>
