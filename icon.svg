<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="50%" r="75%">
      <stop offset="0%"   stop-color="#111019"/>
      <stop offset="100%" stop-color="#08080d"/>
    </radialGradient>

    <!-- Design token: purple sphere gradient -->
    <radialGradient id="token" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#828de8"/>
      <stop offset="100%" stop-color="#4752b8"/>
    </radialGradient>

    <!-- Soft bloom behind the token -->
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>

    <clipPath id="rounded">
      <rect width="128" height="128" rx="26"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- Bloom glow behind the token -->
  <circle cx="30" cy="64" r="26" fill="#5e6ad2"
          filter="url(#bloom)" opacity="0.4" clip-path="url(#rounded)"/>

  <!-- ── Design token ──────────────────────────────
       A filled circle: the universal "variable / color token" symbol -->
  <circle cx="30" cy="64" r="18" fill="url(#token)"/>
  <!-- Inner specular highlight -->
  <circle cx="24" cy="58" r="5" fill="#ffffff" opacity="0.18"/>

  <!-- ── Export arrow ──────────────────────────────
       Thin, clean — connects token to code output -->
  <line x1="52" y1="64" x2="71" y2="64"
        stroke="#5e6ad2" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <polyline points="66,59 72,64 66,69"
            stroke="#5e6ad2" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            fill="none" opacity="0.75"/>

  <!-- ── CSS output ────────────────────────────────
       Two variable declarations stacked, like a code snippet.
       Each line: -- prefix (two purple bars) + name bar + value bar -->

  <!-- Line 1: -- -->
  <rect x="80" y="46" width="10" height="4" rx="2" fill="#5e6ad2"/>
  <rect x="93" y="46" width="10" height="4" rx="2" fill="#5e6ad2"/>
  <!-- Line 1: name bar -->
  <rect x="80" y="55" width="35" height="4" rx="2" fill="#e0e0f0" opacity="0.75"/>
  <!-- Line 1: value bar -->
  <rect x="80" y="64" width="24" height="4" rx="2" fill="#e0e0f0" opacity="0.38"/>

  <!-- Divider -->
  <line x1="80" y1="75" x2="115" y2="75"
        stroke="#ffffff" stroke-width="1" opacity="0.06"/>

  <!-- Line 2: -- -->
  <rect x="80" y="82" width="10" height="4" rx="2" fill="#5e6ad2" opacity="0.7"/>
  <rect x="93" y="82" width="10" height="4" rx="2" fill="#5e6ad2" opacity="0.7"/>
  <!-- Line 2: name bar -->
  <rect x="80" y="91" width="28" height="4" rx="2" fill="#e0e0f0" opacity="0.45"/>
  <!-- Line 2: value bar -->
  <rect x="80" y="100" width="18" height="4" rx="2" fill="#e0e0f0" opacity="0.22"/>
</svg>
