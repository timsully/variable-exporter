<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1c1a2e"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5e6ad2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bounds">
      <rect width="128" height="128" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGlow)"/>

  <!-- Soft purple glow in the upper-center -->
  <ellipse cx="64" cy="52" rx="52" ry="44" fill="url(#glowPurple)" clip-path="url(#bounds)"/>

  <!-- ── Design token (Figma side) ─────────────────────────
       A diamond shape — the universal "token / variable" symbol in design tools -->
  <rect x="14" y="50" width="22" height="22" rx="4" transform="rotate(45 25 61)" fill="#f0f0f2" opacity="0.95"/>

  <!-- Inner dot of the token -->
  <circle cx="25" cy="61" r="4" fill="#0c0c0e" opacity="0.5"/>

  <!-- ── Arrow (the transformation) ──────────────────────── -->
  <!-- Shaft -->
  <line x1="52" y1="61" x2="74" y2="61" stroke="#5e6ad2" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head -->
  <polyline points="69,55 75,61 69,67" stroke="#5e6ad2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ── CSS custom property (code side) ──────────────────
       Two dashes  —  the -- prefix universally associated with CSS variables
       Plus two abstract "value" bars beneath them -->

  <!-- -- prefix: dash one -->
  <rect x="84" y="48" width="14" height="4" rx="2" fill="#5e6ad2"/>
  <!-- -- prefix: dash two -->
  <rect x="100" y="48" width="14" height="4" rx="2" fill="#5e6ad2"/>

  <!-- variable name bar -->
  <rect x="84" y="58" width="24" height="3.5" rx="1.75" fill="#f0f0f2" opacity="0.7"/>
  <!-- value bar (shorter) -->
  <rect x="84" y="66" width="18" height="3.5" rx="1.75" fill="#f0f0f2" opacity="0.45"/>

  <!-- Semicolon dot (subtle) -->
  <circle cx="105" cy="58.75" r="1.5" fill="#5e6ad2" opacity="0.6"/>
  <circle cx="105" cy="68.75" r="1.5" fill="#5e6ad2" opacity="0.5"/>

  <!-- ── Tutorial Tim torch — small, bottom-right corner ── -->
  <g transform="translate(80, 82) scale(1.6)" opacity="0.85">
    <circle cx="12" cy="12" r="12" fill="#2E2B2B"/>
    <path d="M16.5 13.0597C16.5 14.4674 15.7452 15.6892 14.5839 16.4329V18H9.44516V16.4329C8.25484 15.6892 7.5 14.4674 7.5 13.0597C7.5 11.3598 9.96774 6.81796 11.2452 4.58687C11.3323 4.4275 11.5645 4.50718 11.5645 4.66655V11.3067C11.5645 11.5723 11.4194 11.7848 11.2161 11.9442C10.9258 12.1832 10.7516 12.5285 10.8097 12.9269C10.8677 13.405 11.3032 13.7769 11.8258 13.8565C12.5516 13.9362 13.1613 13.4316 13.1613 12.7941C13.1613 12.4754 13.0161 12.1832 12.7548 11.9707C12.5226 11.7848 12.3774 11.5458 12.3774 11.2802V4.66655C12.3774 4.50718 12.6097 4.45406 12.6968 4.58687C14.0032 6.81796 16.5 11.3598 16.5 13.0597Z" fill="#F9F9F9"/>
  </g>
</svg>
